[package]
name = "herdr-native-backends-check"
version = "0.1.0"
edition = "2024"

[dependencies]
raw-window-handle = "0.6"
serde_json = "1"
tracing = "0.1"

[target.'cfg(not(windows))'.dependencies]
x11rb = { version = "0.13", features = ["xkb", "randr", "xtest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

# Keep this opt-in harness out of the application's dependency graph.
[workspace]
